[workspace]
resolver = "2"
members = [
    "crates/strand-core",
    "crates/strand-import",
    "crates/strand-cli",
    "crates/strand-store",
    "crates/strand-app",
]

[workspace.dependencies]
memmap2 = "0.9"
bytemuck = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
fd-lock = "4"
tempfile = "3"
proptest = "1"
criterion = "0.5"
petgraph = "0.6"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Debug builds stay debuggable but deps (egui, wgpu…) get real optimizations
# so `cargo run -p strand-app` isn't unusable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
