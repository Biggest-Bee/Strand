name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Mirrors the release workflow's build command so a package rename or
  # manifest change can't silently break releases while tests stay green.
  release-build:
    name: release build parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - run: cargo build --release --locked -p strand-cli -p strand-gui
