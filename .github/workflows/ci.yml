name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - docs/**

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
