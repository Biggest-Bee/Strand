name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # ubuntu-22.04 for older glibc so binaries run on more systems.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p strand-cli -p strand-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/strand.exe" dist/
            cp "target/${{ matrix.target }}/release/strand-app.exe" dist/
            (cd dist && 7z a "strand-${{ matrix.target }}.zip" strand.exe strand-app.exe)
            rm dist/strand.exe dist/strand-app.exe
          else
            cp "target/${{ matrix.target }}/release/strand" dist/
            cp "target/${{ matrix.target }}/release/strand-app" dist/
            tar -czf "dist/strand-${{ matrix.target }}.tar.gz" -C dist strand strand-app
            rm dist/strand dist/strand-app
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: strand-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256 sums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
