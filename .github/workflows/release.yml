name: Release

on:
  push:
    tags: ["v*"]
  # Manual "Run workflow" button: builds + smoke-tests without releasing
  # (the release job below is guarded to tag refs only).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # ubuntu-22.04 for older glibc so binaries run on more systems.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            # Intel Macs are a legacy pool (macos-13 queues for a long
            # time); cross-compile x86_64 on the ARM runner instead.
            extra_targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      EXTRA_TARGETS: ${{ matrix.extra_targets }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }} ${{ matrix.extra_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        shell: bash
        run: |
          set -e
          cargo build --release --locked -p strand -p strand-app --target ${{ matrix.target }}
          for t in $EXTRA_TARGETS; do
            [ -z "$t" ] && continue
            cargo build --release --locked -p strand -p strand-app --target "$t"
          done

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          pkg_one() {
            local t="$1"
            if [ "${{ matrix.archive }}" = "zip" ]; then
              cp "target/$t/release/strand.exe" dist/
              cp "target/$t/release/strand-app.exe" dist/
              (cd dist && 7z a "strand-$t.zip" strand.exe strand-app.exe)
              rm dist/strand.exe dist/strand-app.exe
            else
              cp "target/$t/release/strand" dist/
              cp "target/$t/release/strand-app" dist/
              tar -czf "dist/strand-$t.tar.gz" -C dist strand strand-app
              rm dist/strand dist/strand-app
            fi
          }
          pkg_one "${{ matrix.target }}"
          for t in $EXTRA_TARGETS; do
            [ -z "$t" ] && continue
            pkg_one "$t"
          done
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: strand-${{ matrix.target }}
          path: dist/*

  # Download each archive back and actually run the binary — proves the
  # artifact launches on its target OS, not just that it compiled.
  # strand-app is a GUI and can't run headless; the CLI covers the
  # shared strand-core/strand-import code paths.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: strand-x86_64-pc-windows-msvc
            archive: strand-x86_64-pc-windows-msvc.zip
            binary: strand.exe
          - os: ubuntu-latest
            artifact: strand-x86_64-unknown-linux-gnu
            archive: strand-x86_64-unknown-linux-gnu.tar.gz
            binary: strand
          # macOS x86_64 runs under Rosetta on the ARM runner — avoids
          # the tiny/slow Intel runner pool (macos-13 queues for ages).
          - os: macos-latest
            artifact: strand-aarch64-apple-darwin
            archive: strand-aarch64-apple-darwin.tar.gz
            binary: strand
          - os: macos-latest
            artifact: strand-aarch64-apple-darwin
            archive: strand-x86_64-apple-darwin.tar.gz
            binary: strand
            rosetta: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Rosetta
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Extract archive
        shell: bash
        run: |
          set -e
          cd dist
          case "${{ matrix.archive }}" in
            *.zip) unzip -o "${{ matrix.archive }}" ;;
            *) tar -xzf "${{ matrix.archive }}" ;;
          esac
          chmod +x "${{ matrix.binary }}" 2>/dev/null || true

      - name: Smoke test binary
        shell: bash
        run: |
          set -e
          cd dist
          # matrix.rosetta -> run the x86_64 binary via Rosetta 2
          run_bin() {
            if [ "${{ matrix.rosetta }}" = "true" ]; then
              arch -x86_64 ./"${{ matrix.binary }}" "$@"
            else
              ./"${{ matrix.binary }}" "$@"
            fi
          }
          run_bin --version
          printf 'src,dst\napp,lib\nlib,core\n' > t.csv
          run_bin build t.csv -o t.strand
          run_bin info t.strand
          # No `grep -q`: it exits on first match and closes the pipe,
          # which panics Rust binaries on EPIPE. Plain grep reads EOF.
          run_bin nodes t.strand | grep app
          run_bin impact t.strand lib

  release:
    needs: [build, smoke]
    # Only publish when the run was triggered by a version tag —
    # workflow_dispatch runs stop after smoke.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checkout first: actions/checkout cleans untracked files by
      # default, which would delete the artifacts dir if it ran after
      # download-artifact. gh release also needs the git context.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256 sums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      # softprops/action-gh-release is archived and stuck on Node 20 —
      # use the preinstalled gh CLI instead.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --generate-notes --latest
