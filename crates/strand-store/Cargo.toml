[package]
name = "strand-store"
version = "0.2.2"
edition = "2021"
description = "Embeddable read-write graph store: immutable CSR base + WAL delta + compaction"
license = "Apache-2.0"
repository = "https://github.com/Biggest-Bee/Strand"
readme.workspace = true
keywords = ["storage", "wal", "embedded-database", "graph"]
categories = ["database-implementations"]

[dependencies]
strand-core = { path = "../strand-core", version = "0.2.0" }
fd-lock.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "store_bench"
harness = false
