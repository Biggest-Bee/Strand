[package]
name = "strand-store"
version = "0.2.0"
edition = "2021"
description = "Embeddable read-write graph store: immutable CSR base + WAL delta + compaction"
license = "Apache-2.0"

[dependencies]
strand-core = { path = "../strand-core" }
fd-lock.workspace = true
serde.workspace = true
serde_json.workspace = true
