[package]
name = "strand-import"
version = "0.10.0"
edition = "2021"
description = "Importers for strand graphs: cargo metadata, CSV/TSV, lockfiles (Cargo.lock, package-lock, poetry.lock, go.mod, pom.xml), and source scanners (Rust/Python/JS)"
license = "Apache-2.0"
repository = "https://github.com/Biggest-Bee/Strand"
readme.workspace = true
keywords = ["import", "parsers", "dependency-graph", "lockfile"]
categories = ["parser-implementations"]

[dependencies]
strand-core = { path = "../strand-core", version = "0.1.0" }
serde_json.workspace = true
thiserror.workspace = true
syn = { version = "3.0.10", features = ["full", "visit"] }
tree-sitter = "0.27.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
toml = "1.2.1"

[dev-dependencies]
tempfile.workspace = true
